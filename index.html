<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مصاريف عمارة 60 - ساوث هيلز 2</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-[#0f172a] text-slate-100 min-h-screen p-4 sm:p-6">
    <div id="app" class="max-w-4xl mx-auto space-y-6"></div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const DB_URL = "https://sh2-bu60-default-rtdb.europe-west1.firebasedatabase.app/.json";

        function BuildingApp() {
            const [buildingData, setBuildingData] = React.useState(null);
            const [loading, setLoading] = React.useState(true);
            const [activeTab, setActiveTab] = React.useState("summary");
            const [selectedApt, setSelectedApt] = React.useState(1);
            const [selectedMonth, setSelectedMonth] = React.useState("يوليو");
            const [saving, setSaving] = React.useState(false);

            // حالة التعديل للشقة المحددة
            const [editOwnerName, setEditOwnerName] = React.useState("");
            const [editCameraPaid, setEditCameraPaid] = React.useState(0);

            // جلب البيانات من فايربيز
            const fetchData = () => {
                fetch(DB_URL)
                    .then(res => res.json())
                    .then(data => {
                        if (data) {
                            setBuildingData(data);
                            // تحديث قيم الحقول المؤقتة للشقة المختارة
                            const apt = data.apartments?.[selectedApt];
                            const camPaid = data.projects?.cameras?.payments?.[selectedApt]?.paid || 0;
                            setEditOwnerName(apt?.ownerName || "");
                            setEditCameraPaid(camPaid);
                        }
                        setLoading(false);
                    })
                    .catch(err => {
                        console.error("خطأ في جلب البيانات:", err);
                        setLoading(false);
                    });
            };

            React.useEffect(() => {
                fetchData();
            }, []);

            // عند تغيير الشقة المختارة، تحديث المدخلات الخاصة بها
            React.useEffect(() => {
                if (buildingData) {
                    const apt = buildingData.apartments?.[selectedApt];
                    const camPaid = buildingData.projects?.cameras?.payments?.[selectedApt]?.paid || 0;
                    setEditOwnerName(apt?.ownerName || "");
                    setEditCameraPaid(camPaid);
                }
            }, [selectedApt, buildingData]);

            // حفظ التعديلات في قاعدة البيانات
            const handleSaveChanges = async () => {
                if (!buildingData) return;
                setSaving(true);
                try {
                    // تحديث بيانات الشقة محلياً في الـ state
                    const updatedData = { ...buildingData };
                    if (!updatedData.apartments[selectedApt]) {
                        updatedData.apartments[selectedApt] = {};
                    }
                    updatedData.apartments[selectedApt].ownerName = editOwnerName;

                    if (!updatedData.projects) updatedData.projects = {};
                    if (!updatedData.projects.cameras) updatedData.projects.cameras = {};
                    if (!updatedData.projects.cameras.payments) updatedData.projects.cameras.payments = {};
                    
                    if (!updatedData.projects.cameras.payments[selectedApt]) {
                        updatedData.projects.cameras.payments[selectedApt] = {};
                    }
                    updatedData.projects.cameras.payments[selectedApt].paid = Number(editCameraPaid);

                    // إرسال البيانات المحدثة بالكامل إلى قاعدة بيانات فايربيز
                    const response = await fetch(DB_URL, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(updatedData)
                    });

                    if (response.ok) {
                        setBuildingData(updatedData);
                        alert("تم حفظ التعديلات بنجاح في قاعدة البيانات! 🟢");
                    } else {
                        alert("حدث خطأ أثناء الحفظ.");
                    }
                } catch (e) {
                    console.error(e);
                    alert("تعذر الاتصال بقاعدة البيانات.");
                }
                setSaving(false);
            };

            if (loading) {
                return <div className="text-center py-20 text-emerald-400 text-lg font-bold">جاري تحميل بيانات العمارة...</div>;
            }

            if (!buildingData) {
                return <div className="text-center py-20 text-rose-400 text-lg font-bold">تعذّر تحميل البيانات.</div>;
            }

            return (
                <div className="space-y-6">
                  <div className="flex justify-between items-center bg-[#1e293b] p-4 rounded-2xl shadow-lg border border-slate-800">
                    <h1 className="text-xl sm:text-2xl font-bold flex items-center gap-2 text-emerald-400">
                      🏢 {buildingData.buildingName || "عمارة 60 - ساوث هيلز 2"}
                    </h1>
                    <span className="text-xs bg-emerald-500/10 text-emerald-400 px-3 py-1.5 rounded-full border border-emerald-500/20">
                      متصل بقاعدة البيانات 🟢
                    </span>
                  </div>

                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                    {['summary', 'months', 'cameras', 'myApt'].map((tab) => {
                      const labels = { summary: "الملخص", months: "الشهر", cameras: "الكاميرات", myApt: "شقتي (تعديل)" };
                      return (
                        <button key={tab} onClick={() => setActiveTab(tab)}
                          className={`p-3 rounded-xl font-medium transition text-center ${activeTab === tab ? "bg-emerald-500 text-slate-950 font-bold shadow-lg" : "bg-[#1e293b] text-slate-300 hover:bg-slate-800"}`}>
                          {labels[tab]}
                        </button>
                      );
                    })}
                  </div>

                  {activeTab === "summary" && (
                    <div className="space-y-6">
                      <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                        <div className="bg-[#1e293b] p-4 rounded-2xl border border-slate-800 shadow">
                          <div className="text-slate-400 text-xs mb-1">الرصيد الحالي بالصندوق</div>
                          <div className="text-xl font-bold text-emerald-400">1,880 ج</div>
                        </div>
                        <div className="bg-[#1e293b] p-4 rounded-2xl border border-slate-800 shadow">
                          <div className="text-slate-400 text-xs mb-1">إجمالي المحصّل</div>
                          <div className="text-xl font-bold text-emerald-400">8,960 ج</div>
                        </div>
                        <div className="bg-[#1e293b] p-4 rounded-2xl border border-slate-800 shadow">
                          <div className="text-slate-400 text-xs mb-1">إجمالي المصروفات</div>
                          <div className="text-xl font-bold text-amber-400">7,080 ج</div>
                        </div>
                        <div className="bg-[#1e293b] p-4 rounded-2xl border border-slate-800 shadow">
                          <div className="text-slate-400 text-xs mb-1">متأخرات المصاريف</div>
                          <div className="text-xl font-bold text-rose-400">12,640 ج</div>
                        </div>
                      </div>

                      <div className="bg-[#1e293b] p-4 rounded-2xl border border-slate-800 flex justify-between items-center">
                        <div>
                          <div className="text-slate-400 text-xs">متبقي الكاميرات (لم يتم تحصيله)</div>
                          <div className="text-lg font-bold text-rose-400">{buildingData.projects?.cameras?.totalRemaining || 15730} ج</div>
                        </div>
                        <button onClick={() => setActiveTab("cameras")} className="text-xs bg-emerald-500/20 text-emerald-400 px-3 py-2 rounded-lg">عرض الكاميرات</button>
                      </div>

                      <div className="bg-[#1e293b] rounded-2xl border border-slate-800 overflow-hidden shadow">
                        <div className="p-4 border-b border-slate-800 font-bold text-emerald-400">حركة كل شهر</div>
                        <table className="w-full text-right text-sm">
                          <thead className="bg-slate-900/50 text-slate-400 text-xs">
                            <tr><th className="p-3">الشهر</th><th className="p-3">المحصّل</th><th className="p-3">المصروف</th><th className="p-3">الرصيد</th></tr>
                          </thead>
                          <tbody className="divide-y divide-slate-800">
                            {buildingData.monthsHistory && buildingData.monthsHistory.map((m, idx) => (
                              <tr key={idx} className="hover:bg-slate-800/50">
                                <td className="p-3 font-medium">{m.name}</td>
                                <td className="p-3 text-emerald-400">{m.collected} ج</td>
                                <td className="p-3 text-amber-400">{m.expenses} ج</td>
                                <td className={`p-3 font-bold ${m.balance >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>{m.balance} ج</td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  )}

                  {activeTab === "months" && (
                    <div className="bg-[#1e293b] p-5 rounded-2xl border border-slate-800 space-y-4">
                      <div className="flex justify-between items-center">
                        <h2 className="font-bold text-emerald-400">تفاصيل الشهر</h2>
                        <select value={selectedMonth} onChange={(e) => setSelectedMonth(e.target.value)} className="bg-slate-900 text-slate-200 border border-slate-700 p-2 rounded-xl text-sm">
                          {buildingData.monthsHistory && buildingData.monthsHistory.map((m, i) => <option key={i} value={m.name}>{m.name}</option>)}
                        </select>
                      </div>
                      <div className="p-4 bg-slate-900/60 rounded-xl text-sm">
                        تتابع الآن بيانات شهر: <span className="font-bold text-emerald-400">{selectedMonth}</span>
                      </div>
                    </div>
                  )}

                  {activeTab === "cameras" && (
                    <div className="bg-[#1e293b] rounded-2xl border border-slate-800 overflow-hidden shadow">
                      <div className="p-4 border-b border-slate-800 flex justify-between items-center">
                        <span className="font-bold text-emerald-400">مشروع الكاميرات (المطلوب {buildingData.projects?.cameras?.perApartmentShare || 1430} ج)</span>
                        <span className="text-xs bg-rose-500/20 text-rose-400 px-2.5 py-1 rounded-full">المتبقي: {buildingData.projects?.cameras?.totalRemaining || 15730} ج</span>
                      </div>
                      <div className="max-h-96 overflow-y-auto">
                        <table className="w-full text-right text-sm">
                          <thead className="bg-slate-900/50 text-slate-400 text-xs sticky top-0">
                            <tr><th className="p-3">شقة</th><th className="p-3">المالك</th><th className="p-3">المدفوع</th><th className="p-3">المتبقي</th></tr>
                          </thead>
                          <tbody className="divide-y divide-slate-800">
                            {buildingData.apartments && Object.entries(buildingData.apartments).map(([id, apt]) => {
                              const aptId = Number(id);
                              const paid = buildingData.projects?.cameras?.payments?.[aptId]?.paid || 0;
                              const target = buildingData.projects?.cameras?.perApartmentShare || 1430;
                              const rem = target - paid;
                              return (
                                <tr key={aptId} className="hover:bg-slate-800/50">
                                  <td className="p-3 font-bold text-emerald-400">{aptId}</td>
                                  <td className="p-3">{apt.ownerName}</td>
                                  <td className="p-3 text-emerald-400">{paid} ج</td>
                                  <td className={`p-3 ${rem === 0 ? 'text-slate-500' : 'text-rose-400 font-bold'}`}>{rem} ج</td>
                                </tr>
                              );
                            })}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  )}

                  {activeTab === "myApt" && (
                    <div className="bg-[#1e293b] p-5 rounded-2xl border border-slate-800 space-y-4">
                      <h2 className="font-bold text-emerald-400">اختر الشقة للتعديل وتحديث البيانات:</h2>
                      <select value={selectedApt} onChange={(e) => setSelectedApt(Number(e.target.value))} className="w-full bg-slate-900 text-slate-200 border border-slate-700 p-3 rounded-xl text-sm">
                        {buildingData.apartments && Object.entries(buildingData.apartments).map(([id, apt]) => <option key={id} value={Number(id)}>شقة {id} - {apt.ownerName}</option>)}
                      </select>
                      
                      <div className="bg-slate-900/60 p-4 rounded-xl border border-slate-800 space-y-3">
                        <div className="text-lg font-bold text-emerald-400">تعديل بيانات شقة رقم {selectedApt}</div>
                        
                        <div>
                          <label className="block text-xs text-slate-400 mb-1">اسم المالك / الحالة:</label>
                          <input 
                            type="text" 
                            value={editOwnerName} 
                            onChange={(e) => setEditOwnerName(e.target.value)} 
                            className="w-full bg-slate-800 text-white p-2.5 rounded-lg border border-slate-700 text-sm"
                          />
                        </div>

                        <div>
                          <label className="block text-xs text-slate-400 mb-1">المَدْفُوع لمشروع الكاميرات (ج):</label>
                          <input 
                            type="number" 
                            value={editCameraPaid} 
                            onChange={(
