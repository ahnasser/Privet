tbody tr:hover td{background:color-mix(in srgb,var(--ac) 4%,transparent)}

.tabs button.on{background:var(--ac);color:#04231a;font-weight:700}

[data-t=light]{color-scheme:light;--bg:#f1f5f9;--card:#fff;--in:#f8fafc;--ln:#cbd5e1;--tx:#0f172a;--mu:#64748b;--ac:#059669;--am:#b45309;--rd:#dc2626;--bl:#2563eb}

:root{--shadow:0 14px 34px rgba(0,0,0,.20)}
.card,.chart-card{transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease}
.card:hover,.chart-card:hover{border-color:color-mix(in srgb,var(--ac) 32%,var(--ln));box-shadow:0 16px 38px rgba(0,0,0,.24)}
button,.btn,select,input{transition:background-color .18s ease,border-color .18s ease,box-shadow .18s ease,transform .18s ease}

.report-kpi span{display:block;color:var(--mu);font-size:12px}

function barChart(title,subtitle,series){
  const W=620,H=250,L=44,R=12,T=12,B=48,plotH=H-T-B,plotW=W-L-R;
  const max=Math.max(1,...series.flatMap(s=>s.values));
  const step=plotW/Math.max(1,MONTHS.length),bw=Math.min(16,step*.28),gap=4;
  let svg=`<svg class="chart-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">`;
  for(let g=0;g<=4;g++){
    const val=max*g/4,y=T+plotH*(1-g/4);
    svg+=`<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="var(--ln)" stroke-dasharray="3 4" stroke-width="1"/>`;
    svg+=`<text x="${L-7}" y="${y+4}" text-anchor="end" fill="var(--mu)" font-size="10">${moneyAxis(val)}</text>`;
  }
  MONTHS.forEach((m,i)=>{
    const cx=L+step*(i+.5),count=series.length,totalW=count*bw+(count-1)*gap;
    series.forEach((s,j)=>{
      const v=Math.max(0,Number(s.values[i]||0)),h=plotH*v/max;
      const x=cx-totalW/2+j*(bw+gap),y=T+plotH-h;
      svg+=`<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(0,h)}" rx="4" fill="${s.color}" opacity=".92"><title>${m}: ${s.label} ${num(v)} جنيه</title></rect>`;
    });
    svg+=`<text x="${cx}" y="${H-20}" text-anchor="middle" fill="var(--mu)" font-size="10">${m.slice(0,3)}</text>`;
  });
  svg+="</svg>";
  const legend=series.map(s=>`<span><i class="legend-dot" style="background:${s.color}"></i>${esc(s.label)}</span>`).join("");
  return `<section class="chart-card"><div class="chart-head"><div><h3>${esc(title)}</h3><div class="chart-sub">${esc(subtitle)}</div></div></div>${svg}<div class="chart-legend">${legend}</div></section>`;
}

function searchApts(raw){
  const box=document.getElementById('searchResults'),count=document.getElementById('searchCount');
  if(!box||!count||!isA())return;
  const toLatin=v=>String(v||'').replace(/[٠-٩]/g,d=>String('٠١٢٣٤٥٦٧٨٩'.indexOf(d))).replace(/[۰-۹]/g,d=>String('۰۱۲۳۴۵۶۷۸۹'.indexOf(d)));
  const q=toLatin(raw).trim().toLocaleLowerCase('ar'),qd=q.replace(/\D/g,''),matches=[];
  if(!q){count.textContent='اكتب رقم الشقة أو جزءًا من الاسم أو 3 أرقام على الأقل من الموبايل.';box.innerHTML='';return}
  const numericOnly=/^\d+$/.test(q);
  const apartmentNumberQuery=numericOnly&&qd.length<=2;
  for(let i=1;i<=N;i++){
    const owner=String(apt(i)||''),tenant=String(G.tenantNames?.[i]||''),phone=String(G.phones?.[i]||''),tenantPhone=String(G.tenantPhones?.[i]||'');
    const exactApt=apartmentNumberQuery&&Number(qd)===i;
    const nameHit=!numericOnly&&[owner,tenant].some(v=>v.toLocaleLowerCase('ar').includes(q));
    const phoneHit=numericOnly&&!apartmentNumberQuery&&qd.length>=3&&[phone,tenantPhone].some(v=>normPhone(v).includes(normPhone(q))||normPhone(v).includes(qd));
    if(exactApt||nameHit||phoneHit)matches.push({apt:i,exactApt});
  }
  matches.sort((a,b)=>Number(b.exactApt)-Number(a.exactApt)||a.apt-b.apt);
  count.textContent=`نتائج البحث: ${matches.length} شقة${apartmentNumberQuery?' (مطابقة رقم الشقة فقط)':''}`;
  if(!matches.length){box.innerHTML='<div class="card mu">لا توجد نتائج مطابقة. للبحث برقم الموبايل اكتب 3 أرقام على الأقل.</div>';return}
  box.innerHTML=matches.map(({apt:i,exactApt})=>{
    const owner=apt(i),tenant=G.tenantNames?.[i]||'',ph=G.phones?.[i]||'',tph=G.tenantPhones?.[i]||'',st=isEmpty(i)?'غير مقيمة':isRented(i)?'مستأجرة':'مقيمة';
    const months=MONTHS.filter(m=>(actM(i,m)&&activeFromMonth(i,m))).map(m=>({m,p:pay(i,m),d:pdate(i,m)}));
    const paid=months.reduce((a,x)=>a+x.p,0),dueTotal=months.reduce((s,x)=>s+dueFor(x.m,Y),0),remaining=Math.max(0,dueTotal-paid),late=months.filter(x=>x.p<dueFor(x.m,Y));
    const projectRows=prj().filter(p=>eligible(p,i)).map(p=>{const shareAmt=share(p),v=pp(p,i);return `<div><span>${esc(p.name)}${p.closed?' (مغلق)':''}</span><span>${num(v)} / ${num(shareAmt)} ج ${v>=shareAmt?'<b class="pos">✓</b>':'<b class="neg">متبقي '+num(Math.max(0,shareAmt-v))+' ج</b>'}</span></div>`}).join('');
    const monthlyRows=months.map(x=>`<div><span>${x.m}</span><span>${x.p>0?num(x.p)+' ج':'لم يدفع'} ${x.p>0?`<span class="mu">(${fd(x.d)})</span>`:''}</span></div>`).join('');
    return `<article class="search-result" data-apartment="${i}"><div class="top"><h3>شقة ${i} — ${esc(owner)}</h3><span class="bd ${st==='غير مقيمة'?'no':st==='مستأجرة'?'wa':'ok'}">${st}</span></div>
      <div class="sr-meta">${exactApt?'<span class="bd ok">مطابقة رقم الشقة</span>':''}${ph?`<span>📱 المالك: ${esc(ph)}</span>`:''}${tenant?`<span>👤 المستأجر: ${esc(tenant)}</span>`:''}${tph?`<span>📱 المستأجر: ${esc(tph)}</span>`:''}</div>
      <div class="sr-grid"><div class="sr-stat">إجمالي المدفوع في ${Y}<b class="pos">${num(paid)} ج</b></div><div class="sr-stat">المتبقي حسب الاشتراكات المسجلة<b class="${remaining?'neg':'pos'}">${num(remaining)} ج</b></div><div class="sr-stat">شهور عليها مبلغ متبقٍ<b>${late.length} من ${months.length}</b></div><div class="sr-stat">حالة الإشغال<b>${st}</b></div></div>
      <div class="sr-projects"><b>التحصيل الشهري (${Y})</b>${monthlyRows||'<div class="mu">لا توجد شهور محسوبة على الشقة في هذه السنة.</div>'}</div>
      <div class="sr-projects"><b>المشروعات الخاصة</b>${projectRows||'<div class="mu">لا توجد مشروعات مستحقة على الشقة.</div>'}</div>
      <div class="row" style="margin-top:10px"><button class="btn" onclick="openApt(${i})">فتح كشف حساب الشقة ${i}</button>${ph?`<button class="btn gh" style="color:var(--tx)" onclick="window.open('https://wa.me/${normPhone(ph)}','_blank')">واتساب المالك</button>`:''}${tph?`<button class="btn gh" style="color:var(--tx)" onclick="window.open('https://wa.me/${normPhone(tph)}','_blank')">واتساب المستأجر</button>`:''}</div>
    </article>`;
  }).join('');
}

let reportType="expenses",reportMonth="ALL",reportApt="1",reportProject="";
function reportRows(){
  const rows=[];

    exps().filter(e=>reportMonth==="ALL"||e.month===reportMonth)

    rows.push(["المشروع","رقم الشقة","المالك","نصيب الشقة","المدفوع","المتبقي","تاريخ الدفع","الحالة"]);
    L.forEach(p=>{
      const members=Array.isArray(p.eligibleApts)?p.eligibleApts.map(Number):ALLN().filter(i=>eligible(p,i));
      members.forEach(i=>{
        const dueShare=share(p),paid=pp(p,i);
        rows.push([p.name,i,apt(i),dueShare,paid,Math.max(0,dueShare-paid),p.dates?.[i]||"",p.closed?"مغلق":"مفتوح"]);
      });
    });
  }else if(reportType==="apartment"){

    rows.push(["نوع الحركة","الفترة / المشروع","المطلوب","المدفوع","المتبقي","التاريخ"]);
    months.forEach(m=>{
      const active=(actM(i,m)&&activeFromMonth(i,m)),need=active?dueFor(m,Y):0,p=active?pay(i,m):0;
      rows.push(["اشتراك شهري",m,need,p,Math.max(0,need-p),active?pdate(i,m)||"": "غير محسوب"]);
    });
    prj().forEach(p=>{
      const el=eligible(p,i),need=el?share(p):0,paid=el?pp(p,i):0;
      rows.push(["مشروع",p.name,need,paid,Math.max(0,need-paid),el?(p.dates?.[i]||""):"غير مشارك"]);
    });
  }
  return rows;
}
function reportBarChart(title,subtitle,labels,series){
  const W=720,H=260,L=48,R=14,T=16,B=58,ph=H-T-B,pw=W-L-R;
  const max=Math.max(1,...series.flatMap(s=>s.values.map(v=>Math.max(0,Number(v)||0))));
  const step=pw/Math.max(1,labels.length),count=series.length,bw=Math.min(22,step/(count+1)*.72),gap=Math.max(3,bw*.18);
  let svg=`<svg class="chart-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">`;
  for(let g=0;g<=4;g++){
    const val=max*g/4,y=T+ph*(1-g/4);
    svg+=`<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="var(--ln)" stroke-dasharray="4 5"/>`;
    svg+=`<text x="${L-8}" y="${y+4}" text-anchor="end" fill="var(--mu)" font-size="10">${moneyAxis(val)}</text>`;
  }
  labels.forEach((label,i)=>{
    const cx=L+step*(i+.5),allW=count*bw+(count-1)*gap;
    series.forEach((sr,j)=>{
      const v=Math.max(0,Number(sr.values[i])||0),h=ph*v/max,x=cx-allW/2+j*(bw+gap),y=T+ph-h;
      svg+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0,h).toFixed(1)}" rx="5" fill="${sr.color}" opacity=".92"><title>${esc(label)}: ${esc(sr.label)} ${num(v)} ج</title></rect>`;
    });
    svg+=`<text x="${cx}" y="${H-27}" text-anchor="middle" fill="var(--mu)" font-size="${labels.length>8?10:11}">${esc(String(label).slice(0,9))}</text>`;
  });
  svg+='</svg>';
  const legend=series.map(x=>`<span><i class="legend-dot" style="background:${x.color}"></i>${esc(x.label)}</span>`).join("");
  return `<section class="chart-card report-chart"><div class="chart-head"><div><h3>${esc(title)}</h3><div class="chart-sub">${esc(subtitle)}</div></div><span class="chart-mark">▥</span></div>${svg}<div class="chart-legend">${legend}</div></section>`;
}
function reportDonut(title,subtitle,parts){
  const total=parts.reduce((s,p)=>s+Math.max(0,Number(p.value)||0),0),r=66,c=2*Math.PI*r;
  let offset=0,circles="";
  parts.forEach(p=>{
    const v=Math.max(0,Number(p.value)||0),dash=total?c*v/total:0;
    circles+=`<circle cx="100" cy="100" r="${r}" fill="none" stroke="${p.color}" stroke-width="19" stroke-dasharray="${dash} ${c-dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 100 100)"/>`;
    offset+=dash;
  });
  return `<section class="chart-card report-chart"><div class="chart-head"><div><h3>${esc(title)}</h3><div class="chart-sub">${esc(subtitle)}</div></div><span class="chart-mark">◉</span></div>
    <div class="donut-wrap"><svg viewBox="0 0 200 200" role="img" aria-label="${esc(title)}">${circles||""}<text x="100" y="96" text-anchor="middle" fill="var(--tx)" font-size="19" font-weight="700">${num(total)}</text><text x="100" y="118" text-anchor="middle" fill="var(--mu)" font-size="11">جنيه</text></svg>
    <div class="donut-legend">${parts.map(p=>`<div><span><i class="legend-dot" style="background:${p.color}"></i>${esc(p.label)}</span><b>${num(p.value)} ج</b></div>`).join("")}</div></div></section>`;
}

    <div class="g"><div class="card"><span class="mu">نصيب الشقة</span><b style="color:var(--am)">${num(s)} ج</b></div><div class="card"><span class="mu">إجمالي المشروع</span><b>${num(tot)} ج</b></div><div class="card"><span class="mu">المحصّل</span><b class="pos">${num(col)} ج</b></div><div class="card"><span class="mu">المتبقي</span><b class="neg">${num(Math.max(0,tot-col))} ج</b></div></div>
    <div class="row">${el?`<span>دفعتك: <b>${num(v)} ج</b> من ${num(s)} ج</span>${badge(v,s)}${v>0?` <button class="btn gh" onclick="rcptPrj('${q.id}',${i})">🖨️ إيصال</button>`:""}${f?` <button class="btn gh" onclick="showF('${f}')">🧾 صورة التحويل</button>`:""}`:'<span class="mu">شقتك غير مستحقة على هذا المشروع</span>'}</div></div>`;
  }).join("");
}

function setNet(ok){const e=$("#net");if(e){e.textContent=ok?"● قاعدة البيانات متصلة":"● غير متصل";e.className="bd "+(ok?"ok":"no")}}

function waBtns(i){
  const o=G.phones?.[i],t=isRented(i)?G.tenantPhones?.[i]:"",b=(w,l)=>` <button class="btn gh" style="color:var(--tx)" onclick="remind(${i},'${w}')">${l}</button>`;
  return o&&t?b("o","💬 المالك")+b("t","💬 المستأجر"):b(t&&!o?"t":"o","💬 تذكير");

function rcpt(i,m){const a=pay(i,m);if(a>0)openReceipt({i,amount:a,date:pdate(i,m),purpose:`اشتراك صيانة شهر ${m} ${Y}`,no:`${Y}-${String(i).padStart(2,"0")}-${String(MONTHS.indexOf(m)+1).padStart(2,"0")}`})}
function rcptPrj(id,i){const q=G.projects[id],a=pp(q,i);if(a>0)openReceipt({i,amount:a,date:q.dates?.[i]||"",purpose:`مشروع: ${q.name}`,no:`P-${String(i).padStart(2,"0")}-${String(id).slice(-4)}`})}

  openMo(`<div class="noprint top" style="margin-bottom:8px"><b>إيصال استلام</b><div class="row"><button class="btn" onclick="window.print()">🖨️ طباعة</button><button class="btn gh" style="color:var(--tx)" onclick="closeMo()">إغلاق ✕</button></div></div>
  <div class="rc"><h2>إيصال استلام</h2><div style="text-align:center;margin-bottom:8px">عمارة 60 - ساوث هيلز 2</div>
  <div class="ln"><span>رقم الإيصال</span><b>${esc(r.no)}</b></div><div class="ln"><span>التاريخ</span><b>${fd(r.date)}</b></div>

  <div class="sig"><span>توقيع المستلم: ........................</span><span>ختم / اعتماد</span></div></div>`);

const BK=["apartments","years","projects","monthlyDue","phones","tenantPhones","tenantNames","residents","pending"];
function exportBackup(){
  const o={};BK.forEach(k=>{if(G[k]!==undefined)o[k]=G[k]});
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,1)],{type:"application/json"}));a.download=`building60-backup-${today()}.json`;a.click();
}
function importBackup(inp){
  const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=async()=>{try{
    const o=JSON.parse(r.result),d={};BK.forEach(k=>{if(o[k]!==undefined)d[k]=o[k]});
    if(!Object.keys(d).length)return toast("الملف مش نسخة احتياطية صحيحة",1);
    if(!confirm("هيتم استبدال البيانات الحالية بمحتوى النسخة. متأكد؟"))return;
    await api("","PATCH",d);await load();await syncAccess();initFlt();render();pubSoon();toast("تم استيراد النسخة ✓");
  }catch(e){toast("ملف غير صالح أو تعذر الاستيراد",1)}};
  r.readAsText(f);inp.value="";
}

function shrink(file,max=1100,q=.7){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",q))};im.onerror=no;im.src=r.result};r.onerror=no;r.readAsDataURL(file)})}
async function attach(file,scope="pub"){
  if(!file||!file.type.startsWith("image/"))throw new Error("نوع الملف غير مدعوم");
  if(file.size>8*1024*1024)throw new Error("حجم الصورة أكبر من 8MB");
  const d=await shrink(file),id=scope+"/f"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  await api("files/"+id,"PUT",d);return id;
}

async function showF(id){
  openMo('<div class="mu" style="padding:20px;text-align:center">جارٍ تحميل الصورة…</div>');
  try{const d=await api("files/"+id);openMo(`<div class="noprint top" style="margin-bottom:8px"><b>الإيصال / الفاتورة</b><button class="btn gh" style="color:var(--tx)" onclick="closeMo()">إغلاق ✕</button></div><img src="${d}" alt="" style="max-width:100%;display:block;margin:auto;border-radius:10px">`)}
  catch(e){closeMo();toast("تعذر تحميل الصورة",1)}
}

async function loadLog(){
  try{
    const d=await api("log","GET",undefined,"?orderBy=%22%24key%22&limitToLast=40"),el=$("#logbox");if(!el)return;
    const L=Object.values(d||{}).sort((a,b)=>b.t-a.t);
    el.innerHTML=L.length?`<table>${L.map(l=>`<tr><td>${new Date(l.t).toLocaleString("ar-EG",{dateStyle:"short",timeStyle:"short"})}</td><td>${esc(l.who)}${l.actorUid?`<div class="mu" dir="ltr" title="Firebase UID">UID: ${esc(l.actorUid)}</div>`:""}</td><td style="white-space:normal">${esc(l.msg)}</td></tr>`).join("")}</table>`:"لا توجد تعديلات مسجلة بعد";
  }catch(e){const el=$("#logbox");if(el)el.textContent="تعذر تحميل السجل"}
}
function exportCsv(){
  const r=[["شقة","المالك",...MONTHS,"الإجمالي"]];
  for(let i=1;i<=N;i++){const v=MONTHS.map(m=>pay(i,m));r.push([i,apt(i),...v,v.reduce((a,b)=>a+b,0)])}
  r.push([],["المصروفات"],["الشهر","البيان","المبلغ","التاريخ"]);exps().forEach(e=>r.push([e.month,e.desc,e.amount,e.date||""]));
  const csv="\ufeff"+r.map(x=>x.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=`building60-${Y}.csv`;a.click();
}

document.addEventListener("visibilitychange",()=>{
  if(document.hidden){hiddenAt=Date.now();return}

});
