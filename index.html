<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عمارة 60 - ساوث هيلز 2</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1220;--card:#131f33;--in:#0b1527;--ln:#263750;--tx:#e7eef8;--mu:#9aabc2;--ac:#45e0b0;--am:#ffd166;--rd:#ff718b;--bl:#75aaff;--shadow:0 12px 32px rgba(0,0,0,.16)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(ellipse at top right,rgba(69,224,176,.07),transparent 36%),var(--bg);color:var(--tx);font:15px/1.65 Cairo,system-ui,sans-serif;padding:18px}
.w{max-width:1180px;margin:auto}
.card{background:linear-gradient(145deg,var(--card),color-mix(in srgb,var(--card) 88%,var(--bg)));border:1px solid var(--ln);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
#login{box-shadow:0 20px 60px rgba(0,0,0,.25);padding:26px;max-width:400px;margin:40px auto;text-align:center}
#app>.card:first-child{position:sticky;top:8px;z-index:5;backdrop-filter:blur(14px);background:color-mix(in srgb,var(--card) 92%,transparent)}
h1{margin:0;font-size:clamp(19px,2.2vw,25px);color:var(--ac);letter-spacing:-.3px}h3{margin:0 0 12px;font-size:16px;color:var(--ac)}
::selection{background:var(--ac);color:#06251b}
:focus-visible{outline:2px solid var(--bl);outline-offset:2px}
.mu{color:var(--mu);font-size:12px}
input,select{background:var(--in);color:var(--tx);border:1px solid var(--ln);border-radius:12px;padding:9px 11px;font:inherit;max-width:100%;transition:border-color .18s,box-shadow .18s}
input:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 15%,transparent);outline:0}
td input{width:96px}td input[type=date]{width:136px}
.btn{background:var(--ac);color:#04231a;border:0;border-radius:12px;padding:9px 15px;font:inherit;font-weight:700;cursor:pointer;transition:transform .16s,filter .16s,box-shadow .16s;box-shadow:0 3px 10px color-mix(in srgb,var(--ac) 12%,transparent)}
.btn.am{background:var(--am);color:#2b1d00}.btn.gh{background:transparent;color:var(--rd);border:1px solid var(--ln);box-shadow:none}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}.btn:active{transform:scale(.98)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
nav button,.chip{flex:none;background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:13px;padding:9px 15px;font:inherit;cursor:pointer;transition:background .16s,border-color .16s,transform .16s}
nav button:hover,.chip:hover{border-color:var(--ac);transform:translateY(-1px)}
nav button.on,.chip.on{background:var(--ac);color:#04231a;border-color:var(--ac);font-weight:700;box-shadow:0 4px 14px color-mix(in srgb,var(--ac) 18%,transparent)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.g .card{margin:0}.g b{font-size:20px;display:block}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th{color:var(--mu);font-size:12px;text-align:right;padding:11px 10px;border-bottom:1px solid var(--ln);white-space:nowrap;background:color-mix(in srgb,var(--in) 65%,transparent)}
td{padding:10px;border-bottom:1px solid color-mix(in srgb,var(--ln) 75%,transparent);white-space:nowrap}
tbody tr:hover td{background:color-mix(in srgb,var(--ac) 4%,transparent)}
.bd{font-size:12px;padding:2px 10px;border-radius:99px;font-weight:600}
.ok{background:#064e3b;color:var(--ac)}.wa{background:#4a3500;color:var(--am)}.no{background:#4c1d24;color:var(--rd)}
.pos{color:var(--ac)}.neg{color:var(--rd)}
#err{color:var(--rd);font-size:13px;min-height:20px;text-align:center;margin-top:10px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#065f46;color:#fff;padding:12px 20px;border-radius:14px;opacity:0;transition:opacity .22s,transform .22s;pointer-events:none;z-index:20;box-shadow:0 10px 28px rgba(0,0,0,.25);max-width:calc(100vw - 28px);text-align:center}
#toast.show{opacity:1}#toast.bad{background:#9f1239}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.mg div{background:var(--in);border:1px solid var(--ln);border-radius:12px;padding:8px 10px}
[hidden]{display:none!important}
#th{position:fixed;bottom:16px;left:12px;z-index:9;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:50%;width:38px;height:38px;cursor:pointer;font-size:17px}
:root{color-scheme:dark}
[data-t=light]{color-scheme:light;--bg:#f1f5f9;--card:#fff;--in:#f8fafc;--ln:#cbd5e1;--tx:#0f172a;--mu:#64748b;--ac:#059669;--am:#b45309;--rd:#dc2626;--bl:#2563eb}
[data-t=light] .ok{background:#d1fae5}[data-t=light] .wa{background:#fef3c7}[data-t=light] .no{background:#ffe4e6}
[data-t=light] td{border-color:#e2e8f0}
[data-t=light] .btn,[data-t=light] nav button.on,[data-t=light] .chip.on{color:#fff}
.em{opacity:.5}
table.adm{table-layout:fixed}
table.adm td,table.adm th{padding:6px 4px}
table.adm input,table.adm select{width:100%!important;padding:6px;font-size:13px}
#app{display:grid;grid-template-columns:230px minmax(0,1fr);grid-template-rows:auto 1fr;gap:14px;align-items:start;max-width:1480px;margin:0 auto}
#app>.card:first-child{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:18px;border-radius:22px;padding:16px 22px}
#nav{grid-column:1;grid-row:2;display:flex;flex-direction:column;gap:7px;overflow:visible;margin:0;padding:12px;background:linear-gradient(160deg,var(--card),color-mix(in srgb,var(--card) 86%,var(--bg)));border:1px solid var(--ln);border-radius:20px;min-height:calc(100vh - 130px);position:sticky;top:12px}
#nav:before{content:"🏢  القائمة الرئيسية";display:block;color:var(--mu);font-weight:700;font-size:13px;padding:6px 10px 12px;border-bottom:1px solid var(--ln);margin-bottom:5px}
#nav button{text-align:right;width:100%;border-radius:12px;padding:11px 13px;white-space:normal}
#view{grid-column:2;grid-row:2;min-width:0}
#view>.card{border-radius:20px}
@media(max-width:850px){
 #app{grid-template-columns:1fr;gap:10px}
 #app>.card:first-child{grid-column:1;position:relative;top:auto;padding:13px}
 #nav{grid-column:1;grid-row:2;min-height:0;position:relative;top:auto;flex-direction:row;overflow-x:auto;padding:8px}
 #nav:before{display:none}
 #nav button{width:auto;white-space:nowrap;text-align:center}
 #view{grid-column:1;grid-row:3}
}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;display:flex;align-items:center;justify-content:center;padding:14px}
.mo[hidden]{display:none}
.mb{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:16px;max-width:560px;width:100%;max-height:92vh;overflow:auto}
.ln2{display:flex;justify-content:space-between;background:var(--in);border:1px solid var(--ln);border-radius:10px;padding:8px 12px;margin-top:8px;font-size:14px}
.cap{display:block;font-size:12px;color:var(--mu);margin-top:2px}
</style>
</head>
<body>
<button id="th" title="فاتح / داكن" onclick="theme(document.documentElement.dataset.t==='light'?'dark':'light')">☀️</button>
<div class="w">

<div id="login" class="card">
  <h1>🏢 عمارة 60 - ساوث هيلز 2</h1>
  <div class="mu" style="margin:4px 0 16px">نظام إدارة التحصيلات والمصروفات</div>
  <button class="btn" style="width:100%;padding:12px" onclick="googleLogin()">الدخول بحساب Google 🔑</button>
  <div id="err"></div>
  <div id="ld" class="mu" style="margin-top:10px" hidden>جارٍ التحميل…</div>
  <div class="mu" style="margin-top:14px">لو ظهر خطأ في الدخول افتح الرابط من Chrome أو Safari مباشرة.</div>
</div>

<div id="app" hidden>
  <div class="card top">
    <div><h1>🏢 عمارة 60 - ساوث هيلز 2</h1><span id="who" class="mu"></span> <span id="net" class="bd ok">● متصل</span></div>
    <div class="row">
      <select id="yr" onchange="Y=this.value;initFlt();render()"><option>2025</option><option selected>2026</option><option>2027</option></select>
      <button class="btn gh" style="color:var(--tx)" onclick="reload()">تحديث ⟳</button>
      <button class="btn gh" onclick="logout()">خروج</button>
    </div>
  </div>
  <nav id="nav"></nav>
  <main id="view"></main>
</div>

</div>
<div id="mo" class="mo" hidden onclick="if(event.target===this)closeMo()"><div class="mb" id="mb"></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyAQf5ZHFIgR1RqJiZAnc4_xk6Sa4kUZbjs",authDomain:"sh2-bu60.firebaseapp.com",projectId:"sh2-bu60",appId:"1:398417900233:web:d3ea5648000139f30d5318"});
const auth=firebase.auth();
const DB = "https://sh2-bu60-default-rtdb.europe-west1.firebasedatabase.app";
const N = 24;
const MONTHS = ["يناير","فبراير","مارس","إبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];

/* إيميلك الإداري المباشر بدون أخطاء مطبعية */
const ADMIN_EMAIL = "anasser.awaad@gmail.com";

function makeSeed(){
  const names=["السيد كرم الدين","(فارغ)","أحمد محمد عبدالرحمن","هاني محمود حسين","أسماء صلاح حسن","إيمان إبراهيم محمود","أحمد يوسف حسن","أحمد ناصر","أميرة محمد فاروق","شريف صلاح الدين","منى محمود نجيب","لبيب أنور","أحمد فتحي محمد","إسلام عماد الدين","نهى حسين حافظ أمين","مصطفى أمدين","(فارغ)","أحمد ربيع شوقي","محمد أحمد عبد الفتاح","أماني محمد مصطفى","أحمد سمير","(فارغ)","عادل عبد الرازق","عاطف محمد صادق"];
  const apartments={};names.forEach((n,i)=>apartments[i+1]={ownerName:n});
  const residents={[ADMIN_EMAIL.replace(/\./g,",")]:8};
  return {monthlyDue:180,apartments,residents,projects:{},years:{"2026":{monthlyPayments:{},payDates:{},expenses:{}}}};
}

let G=null,U=null,Y="2026",tab="sum",selM=MONTHS[new Date().getMonth()],flt=new Set();
const $=s=>document.querySelector(s);
const esc=t=>String(t?? "").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=v=>Number(v||0).toLocaleString("en-US");
const fd=d=>d?d.slice(8,10)+"/"+d.slice(5,7)+"/"+d.slice(0,4):"—";
const today=()=>{const d=new Date(),p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`};
const isA=()=>U&&U.role==="admin";

function theme(t){document.documentElement.dataset.t=t;localStorage.setItem("b60t",t);$("#th").textContent=t==="light"?"🌙":"☀️"}
theme(localStorage.getItem("b60t")||"dark");

const url=p=>DB+"/"+p.split("/").filter(Boolean).map(encodeURIComponent).join("/")+".json";
async function api(p,method="GET",body){
  const t=await auth.currentUser.getIdToken();
  const r=await fetch(url(p)+"?auth="+t,{method,headers:{"Content-Type":"application/json"},body:body===undefined?undefined:JSON.stringify(body)});
  if(!r.ok)throw new Error("HTTP "+r.status);
  return r.json();
}

function googleLogin(){
  $("#err").textContent="";
  auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>{
    $("#err").textContent="تعذر الدخول: "+e.message;
  });
}
function logout(){auth.signOut()}
function showLogin(){U=null;G=null;$("#app").hidden=true;$("#login").hidden=false;$("#ld").hidden=true}

async function start(u){
  $("#err").textContent="";
  $("#ld").hidden=false;
  const email=(u.email||"").toLowerCase();
  
  // اختبار لو المستخدم هو الأدمن الرئيسي تلقائياً
  const isAdmin = email === ADMIN_EMAIL.toLowerCase();
  U = { role: isAdmin ? "admin" : "resident", email, apt: 8 };

  try {
    // التأكد من وجود البيانات الأساسية وإن لم توجد تزرع فوراً
    let resData = await api("residents");
    if(!resData){
      await api("","PATCH",makeSeed());
      resData = await api("residents");
    }
    
    // تحميل بيانات النظام
    G = await api("");
    G.apartments ??= {}; G.years ??= {}; G.projects ??= {}; G.residents ??= {};
    
    // ضبط الصلاحية
    const key = email.replace(/\./g,",");
    if(!isAdmin && !G.residents[key]){
      await auth.signOut();
      $("#ld").hidden=true;
      $("#err").textContent=`الإيميل ${email} غير مسجل. اطلب من الأدمن إضافته.`;
      return;
    }

    $("#ld").hidden=true;
    $("#login").hidden=true;
    $("#app").hidden=false;
    tab = isA() ? "sum" : "me";
    initFlt();
    render();
  } catch(err) {
    console.error(err);
    $("#ld").hidden=true;
    $("#err").textContent="حدث خطأ في الاتصال بقاعدة البيانات: "+err.message;
  }
}

function initFlt(){
  flt=new Set(MONTHS);
}

function render(){
  if(!G||!U)return;
  const T = isA() ? [["sum","الملخص"],["month","التحصيل الشهري"],["exp","المصروفات"],["adm","الإدارة ⚙️"]] 
                  : [["me","شقتي 🏠"],["sum","الملخص"],["month","التحصيل الشهري"]];
  $("#nav").innerHTML=T.map(([k,l])=>`<button class="${k===tab?"on":""}" onclick="tab='${k}';render()">${l}</button>`).join("");
  $("#who").textContent=isA()?"وضع المشرف 🛠️":`شقة ${U.apt}`;
  
  if(tab==="sum") $("#view").innerHTML = `
    <div class="card">
      <h3>ملخص سنة ${Y}</h3>
      <p>أهلاً بك يا باشمهندس. النظام جاهز ويعمل بكفاءة الآن.</p>
    </div>`;
  else if(tab==="adm") $("#view").innerHTML = `
    <div class="card">
      <h3>⚙️ لوحة الإدارة والإيميلات</h3>
      <p>الإيميل الرئيسي الحلي: <b>${ADMIN_EMAIL}</b></p>
    </div>`;
  else $("#view").innerHTML = `<div class="card"><h3>مرحباً بك</h3></div>`;
}

async function reload(){
  try{
    G=await api("");
    render();
    toast("تم التحديث ✓");
  }catch(e){toast("فشل التحديث",1)}
}

function toast(t,bad){
  const e=$("#toast");e.textContent=t;e.className="show"+(bad?" bad":"");
  setTimeout(()=>e.className="",2500);
}

auth.onAuthStateChanged(u=>{
  if(!u){showLogin();return}
  start(u);
});
</script>
</body>
</html>
