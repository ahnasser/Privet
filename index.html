<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عمارة 60 - ساوث هيلز 2</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f172a;--card:#1e293b;--in:#0b1220;--ln:#334155;--tx:#e2e8f0;--mu:#94a3b8;--ac:#34d399;--am:#fbbf24;--rd:#fb7185;--bl:#60a5fa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 Cairo,system-ui,sans-serif;padding:14px}
.w{max-width:960px;margin:auto}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:12px}
h1{margin:0;font-size:19px;color:var(--ac)}h3{margin:0 0 10px;font-size:15px;color:var(--ac)}
.mu{color:var(--mu);font-size:12px}
input,select{background:var(--in);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:8px 10px;font:inherit;max-width:100%}
td input{width:96px}td input[type=date]{width:136px}
.btn{background:var(--ac);color:#04231a;border:0;border-radius:10px;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer}
.btn.am{background:var(--am);color:#2b1d00}.btn.gh{background:transparent;color:var(--rd);border:1px solid var(--ln)}
.btn:active{transform:scale(.97)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
nav button,.chip{flex:none;background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:12px;padding:8px 14px;font:inherit;cursor:pointer}
nav button.on,.chip.on{background:var(--ac);color:#04231a;border-color:var(--ac);font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.g .card{margin:0}.g b{font-size:20px;display:block}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th{color:var(--mu);font-size:12px;text-align:right;padding:8px;border-bottom:1px solid var(--ln);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid #26334a;white-space:nowrap}
.bd{font-size:12px;padding:2px 10px;border-radius:99px;font-weight:600}
.ok{background:#064e3b;color:var(--ac)}.wa{background:#4a3500;color:var(--am)}.no{background:#4c1d24;color:var(--rd)}
.pos{color:var(--ac)}.neg{color:var(--rd)}
#login{max-width:400px;margin:40px auto}#login input,#login select{width:100%;margin:4px 0 10px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.tabs button{background:var(--in);color:var(--mu);border:1px solid var(--ln);border-radius:12px;padding:9px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--ac);color:#04231a;font-weight:700}
#err{color:var(--rd);font-size:13px;min-height:20px;text-align:center}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#065f46;color:#fff;padding:10px 18px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
#toast.show{opacity:1}#toast.bad{background:#9f1239}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.mg div{background:var(--in);border:1px solid var(--ln);border-radius:12px;padding:8px 10px}
[hidden]{display:none!important}
#th{position:fixed;top:10px;left:10px;z-index:9;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:50%;width:38px;height:38px;cursor:pointer;font-size:17px}
:root{color-scheme:dark}
[data-t=light]{color-scheme:light;--bg:#f1f5f9;--card:#fff;--in:#f8fafc;--ln:#cbd5e1;--tx:#0f172a;--mu:#64748b;--ac:#059669;--am:#b45309;--rd:#dc2626;--bl:#2563eb}
[data-t=light] .ok{background:#d1fae5}[data-t=light] .wa{background:#fef3c7}[data-t=light] .no{background:#ffe4e6}
[data-t=light] td{border-color:#e2e8f0}
[data-t=light] .btn,[data-t=light] nav button.on,[data-t=light] .chip.on,[data-t=light] .tabs button.on{color:#fff}
[data-t=light] .btn.gh{color:var(--rd)}
</style>
</head>
<body>
<button id="th" title="فاتح / داكن" onclick="theme(document.documentElement.dataset.t==='light'?'dark':'light')">☀️</button>
<div class="w">

<div id="login" class="card" style="text-align:center">
  <h1>🏢 عمارة 60 - ساوث هيلز 2</h1><div class="mu" style="margin:4px 0 16px">نظام إدارة التحصيلات والمصروفات</div>
  <button class="btn" style="width:100%;padding:12px" onclick="googleLogin()">الدخول بحساب Google 🔑</button>
  <div id="err" style="margin-top:10px"></div>
  <div id="ld" class="mu">جارٍ التحميل…</div>
  <div class="mu" style="margin-top:12px">لو ظهر خطأ في الدخول افتح الرابط من Chrome أو Safari مباشرة (مش من جوّه واتساب أو فيسبوك).</div>
</div>

<div id="app" hidden>
  <div class="card top">
    <div><h1>🏢 عمارة 60 - ساوث هيلز 2</h1><span id="who" class="mu"></span></div>
    <div class="row">
      <select id="yr" onchange="Y=this.value;initFlt();render()"><option>2025</option><option selected>2026</option><option>2027</option></select>
      <button class="btn gh" style="color:var(--tx)" onclick="reload()">تحديث ⟳</button>
      <button class="btn gh" onclick="logout()">خروج</button>
    </div>
  </div>
  <nav id="nav"></nav>
  <main id="view"></main>
</div>

</div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyAQf5ZHFIgR1RqJiZAnc4_xk6Sa4kUZbjs",authDomain:"sh2-bu60.firebaseapp.com",projectId:"sh2-bu60",appId:"1:398417900233:web:d3ea5648000139f30d5318"});
const auth=firebase.auth();
const DB = "https://sh2-bu60-default-rtdb.europe-west1.firebasedatabase.app";
const N = 24;
const MONTHS = ["يناير","فبراير","مارس","إبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];

/* ---------- بيانات الشيت الأصلية (تُستخدم لو القاعدة فاضية أو عند الاستعادة) ---------- */
function makeSeed(){
  const names=["السيد كرم الدين","(فارغ)","أحمد محمد عبدالرحمن","هاني محمود حسين","أسماء صلاح حسن","إيمان إبراهيم محمود","أحمد يوسف حسن","أحمد ناصر","أميرة محمد فاروق","شريف صلاح الدين","منى محمود نجيب","لبيب أنور","أحمد فتحي محمد","إسلام عماد الدين","نهى حسين حافظ أمين","مصطفى أمدين","(فارغ)","أحمد ربيع شوقي","محمد أحمد عبد الفتاح","أماني محمد مصطفى","أحمد سمير","(فارغ)","عادل عبد الرازق","عاطف محمد صادق"];
  const apartments={};names.forEach((n,i)=>apartments[i+1]={ownerName:n});
  const mp={},pd={};
  const add=(m,i,v,d)=>{(mp[i]??={})[m]=v;if(d)(pd[i]??={})[m]=d};
  [3,5,6,8,10,11,16,18,19,23].forEach(i=>add("يوليو",i,160));
  [3,5,8,10,11,16,18,19,23].forEach(i=>add("أغسطس",i,180));add("أغسطس",6,160);
  [3,5,6,8,10,11,14,16,18,19,23].forEach(i=>{add("سبتمبر",i,180);add("أكتوبر",i,180)});
  [3,5,6,8,11,14,18,20,23].forEach(i=>add("نوفمبر",i,180));
  const D=(m,i,d)=>(pd[i]??={})[m]=d;
  D("أكتوبر",5,"2026-10-05");D("أكتوبر",8,"2026-10-04");D("أكتوبر",14,"2026-10-15");D("أكتوبر",16,"2026-10-10");
  [3,5,8,11,18,20].forEach(i=>D("نوفمبر",i,"2026-11-01"));D("نوفمبر",6,"2026-10-22");D("نوفمبر",14,"2026-10-15");D("نوفمبر",23,"2026-09-30");
  const cp={},cd={},cdates={1:"2026-09-21",3:"2026-10-01",4:"2026-10-02",5:"2026-10-15",6:"2026-09-24",7:"2026-10-09",8:"2026-10-04",9:"2026-09-30",11:"2026-10-01",13:"2026-11-03",18:"2026-09-19",20:"2026-11-01",23:"2026-10-01"};
  Object.keys(cdates).forEach(i=>{cp[i]=1430;cd[i]=cdates[i]});
  const E=(month,desc,amount,date)=>({month,desc,amount,date});
  const list=[E("يوليو","نظافة السلم",1400,""),E("يوليو","صيانة كهرباء الانتركم",200,"2026-07-29"),
    E("أغسطس","نظافة السلم وتنظيف حوالين العمارة",600,"2026-08-29"),
    E("سبتمبر","نظافة السلم وتنظيف حوالين العمارة",400,"2026-09-10"),E("سبتمبر","نباتات لمدخل العمارة",1100,"2026-09-14"),E("سبتمبر","5 شجيرات",680,"2026-09-20"),E("سبتمبر","تكلفة زرع الشجيرات",300,"2026-09-20"),
    E("أكتوبر","نظافة السلم وتنظيف حوالين العمارة",600,"2026-10-01"),E("أكتوبر","سقي الزرع",500,"2026-10-08"),E("أكتوبر","نظافة السلم",400,"2026-10-13"),E("أكتوبر","نظافة السلم (كاش)",400,"2026-10-23"),
    E("نوفمبر","سقي الزرع",500,"2026-11-02")];
  const expenses={};list.forEach((e,i)=>expenses["e"+String(i+1).padStart(3,"0")]=e);
  return {monthlyDue:180,apartments,
    projects:{cam:{name:"الكاميرات",perApt:1430,payments:cp,dates:cd}},
    years:{"2026":{monthlyPayments:mp,payDates:pd,expenses}}};
}

/* ---------- حالة التطبيق ---------- */
let G=null,U=null,Y="2026",tab="sum",selM=MONTHS[new Date().getMonth()],expF="ALL",flt=new Set();
const $=s=>document.querySelector(s);
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=v=>Number(v||0).toLocaleString("en-US");
const fd=d=>d?d.slice(8,10)+"/"+d.slice(5,7)+"/"+d.slice(0,4):"—";
const today=()=>new Date().toISOString().slice(0,10);
const isA=()=>U&&U.role==="admin";
function theme(t){document.documentElement.dataset.t=t;localStorage.setItem("b60t",t);$("#th").textContent=t==="light"?"🌙":"☀️"}
theme(localStorage.getItem("b60t")||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"));

/* ---------- الوصول لـ Firebase ---------- */
const url=p=>DB+"/"+p.split("/").filter(Boolean).map(encodeURIComponent).join("/")+".json";
async function api(p,method="GET",body,q=""){
  const t=await tok(),r=await fetch(url(p)+(q?q+"&":"?")+"auth="+t,{method,headers:{"Content-Type":"application/json"},body:body===undefined?undefined:JSON.stringify(body)});
  if(!r.ok)throw new Error("HTTP "+r.status);
  return r.json();
}
function setLocal(path,v){
  const k=path.split("/");let o=G;
  k.slice(0,-1).forEach(s=>o=o[s]??(o[s]={}));
  if(v===null)delete o[k[k.length-1]];else o[k[k.length-1]]=v;
}
/* كتابة آمنة: تعديل مسارات محددة فقط (لا نكتب فوق القاعدة كلها) */
async function upd(o,msg){
  try{const w={...o,["log/"+Date.now().toString(36)+Math.random().toString(36).slice(2,4)]:{t:Date.now(),who:isA()?"المشرف":"شقة "+U.apt,msg:(msg||"تعديل").replace(" ✓","")}};await api("","PATCH",w);Object.entries(o).forEach(([p,v])=>setLocal(p,v));toast(msg||"تم الحفظ ✓")}
  catch(e){toast("تعذر الحفظ، تأكد من الاتصال وقواعد Firebase",1)}
  render();
}
async function load(){
  const names=["apartments","years","projects","monthlyDue"].concat(isA()?["residents","pending"]:[]),o={};
  await Promise.all(names.map(async k=>o[k]=await api(k)));
  G=o;G.apartments??={};G.years??={};G.projects??={};G.residents??={};G.pending??={};
}
async function reload(){try{await load();initFlt();render();toast("تم التحديث ✓")}catch(e){toast("تعذر الاتصال بقاعدة البيانات",1)}}

/* ---------- قراءة البيانات ---------- */
const due=()=>Number(G.monthlyDue||180), share=p=>Number(p?.perApt||0),prj=()=>Object.entries(G.projects||{}).map(([id,p])=>({id,...p})),pp=(p,i)=>Number(p.payments?.[i]||0);
const apt=i=>G.apartments?.[i]?.ownerName||"—";
const pay=(i,m)=>Number(G.years?.[Y]?.monthlyPayments?.[i]?.[m]||0);
const pdate=(i,m)=>G.years?.[Y]?.payDates?.[i]?.[m]||"";
const pfile=(i,m)=>G.years?.[Y]?.payFiles?.[i]?.[m]||"";
const exps=()=>Object.entries(G.years?.[Y]?.expenses||{}).filter(([,e])=>e).map(([id,e])=>({id,...e}))
  .sort((a,b)=>MONTHS.indexOf(a.month)-MONTHS.indexOf(b.month)||(a.date||"").localeCompare(b.date||""));
function initFlt(){
  flt=new Set();
  MONTHS.forEach(m=>{
    const hasPay=Object.values(G.years?.[Y]?.monthlyPayments||{}).some(a=>a&&a[m]);
    if(hasPay||exps().some(e=>e.month===m))flt.add(m);
  });
}
const badge=(p,d)=>p>=d?'<b class="bd ok">مدفوع</b>':p>0?`<b class="bd wa">متبقي ${num(d-p)}</b>`:'<b class="bd no">لم يدفع</b>';
function toast(t,bad){const e=$("#toast");e.textContent=t;e.className="show"+(bad?" bad":"");clearTimeout(toast.t);toast.t=setTimeout(()=>e.className="",2600)}

/* ---------- الدخول بحساب Google ---------- */
const tok=()=>auth.currentUser.getIdToken();
function googleLogin(){
  $("#err").textContent="";
  auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>{
    $("#err").textContent=({"auth/unauthorized-domain":"الدومين غير مضاف في Authorized domains","auth/popup-blocked":"المتصفح منع النافذة، اسمح بها أو افتح من Chrome/Safari","auth/popup-closed-by-user":"تم إغلاق نافذة الدخول"})[e.code]||("تعذر الدخول: "+e.code);
  });
}
function logout(){auth.signOut()}
function showLogin(){U=null;G=null;$("#app").hidden=true;$("#login").hidden=false;$("#ld").hidden=true}
const emailsOf=i=>Object.entries(G.residents||{}).filter(([,v])=>Number(v)===i).map(([k])=>k.replace(/,/g,"."));
async function start(u){
  $("#err").textContent="";$("#ld").hidden=false;
  const email=(u.email||"").toLowerCase(),key=email.replace(/\./g,",");
  let admin=false;try{await api("residents");admin=true}catch(e){}
  U={role:admin?"admin":"resident",email,apt:0};
  if(!admin){
    let a=null;try{a=await api("residents/"+key)}catch(e){}
    if(a==null){await auth.signOut();$("#err").textContent=`الإيميل ${email} غير مسجل في أي شقة. اطلب من الأدمن يسجله.`;return}
    U.apt=Number(a);
  }
  await load();
  if(admin){
    U.apt=Number(G.residents[key])||0;
    const ks=await api("","GET",undefined,"?shallow=true");
    if(ks&&("adminPassword" in ks||"passwords" in ks))await api("","PATCH",{adminPassword:null,passwords:null});
  }
  $("#ld").hidden=true;enter();
}
function enter(){$("#login").hidden=true;$("#app").hidden=false;tab=isA()?"sum":"me";initFlt();render()}

/* ---------- العرض ---------- */
function go(k){tab=k;render();scrollTo(0,0)}
function render(){
  if(!G||!U)return;
  const np=Object.keys(G.pending||{}).length,
    T=isA()?[["req","الطلبات"+(np?` (${np})`:"")],["sum","الملخص"],["month","التحصيل الشهري"],["exp","المصروفات"],["cam","المشاريع"],...(U.apt?[["me","شقتي 🏠"]]:[]),["adm","الإدارة ⚙️"]]
            :[["me","شقتي 🏠"],["send","رفع تحويل 📤"],["sum","الملخص"],["month","التحصيل الشهري"],["exp","المصروفات"],["cam","المشاريع"]];
  if(!T.some(t=>t[0]===tab))tab=T[0][0];
  $("#nav").innerHTML=T.map(([k,l])=>`<button class="${k===tab?"on":""}" onclick="go('${k}')">${l}</button>`).join("");
  $("#who").textContent=isA()?"وضع المشرف 🛠️":`شقة ${U.apt} - ${apt(U.apt)}`;
  $("#view").innerHTML=({sum:vSum,month:vMonth,exp:vExp,cam:vCam,adm:vAdm,me:vMe,req:vReq,send:vSend})[tab]();
  if(tab==="adm")loadLog();
}

/* --- الملخص --- */
function togM(m){flt.has(m)?flt.delete(m):flt.add(m);render()}
function allM(on){flt=on?new Set(MONTHS):new Set();render()}
function vSum(){
  const ms=MONTHS.filter(m=>flt.has(m)),d=due(),AP=prj().filter(q=>!q.closed);let c=0,rows="";
  for(let i=1;i<=N;i++){
    const p=ms.reduce((s,m)=>s+pay(i,m),0),need=d*ms.length,cp=AP.reduce((s,q)=>s+Math.max(0,share(q)-pp(q,i)),0);c+=p;
    rows+=`<tr><td>${i}</td><td>${esc(apt(i))}</td><td class="pos">${num(p)}</td><td class="${need-p>0?"neg":""}">${num(Math.max(0,need-p))}</td><td>${cp<=0?'<b class="bd ok">مسدّد</b>':`<b class="bd no">متبقي ${num(cp)}</b>`}</td></tr>`;
  }
  const x=exps().filter(e=>flt.has(e.month)).reduce((s,e)=>s+Number(e.amount||0),0);
  const cam=AP.reduce((s,q)=>s+Object.values(q.payments||{}).reduce((a,b)=>a+Number(b||0),0),0);
  return `<div class="card"><div class="top"><h3>🗓️ الشهور المحسوبة</h3><div class="row"><button class="chip" onclick="allM(true)">الكل</button><button class="chip" onclick="allM(false)">لا شيء</button></div></div>
    <div class="chips">${MONTHS.map(m=>`<button class="chip ${flt.has(m)?"on":""}" onclick="togM('${m}')">${m}</button>`).join("")}</div></div>
  <div class="g"><div class="card"><span class="mu">الرصيد (الفترة)</span><b class="${c-x<0?"neg":"pos"}">${num(c-x)} ج</b></div>
    <div class="card"><span class="mu">المحصّل</span><b class="pos">${num(c)} ج</b></div>
    <div class="card"><span class="mu">المصروفات</span><b style="color:var(--am)">${num(x)} ج</b></div>
    <div class="card"><span class="mu">المشاريع الخاصة (مستقلة)</span><b style="color:var(--bl)">${num(cam)} ج</b></div></div>
  <div class="card"><h3>موقف التحصيل لسنة ${Y}</h3><div class="tw"><table><tr><th>شقة</th><th>المالك</th><th>المدفوع</th><th>المتبقي</th><th>المشاريع</th></tr>${rows}</table></div></div>`;
}

/* --- التحصيل الشهري (تاريخ + صورة التحويل) --- */
const attBtn=(id,t="")=>`<label class="btn gh" style="padding:6px 10px">📎${t}<input type="file" accept="image/*" id="${id}" hidden onchange="this.parentNode.firstChild.textContent='✅'"></label>`;
function vMonth(){
  const A=isA(),d=due();let c=0,rows="";
  for(let i=1;i<=N;i++){
    const p=pay(i,selM),dt=pdate(i,selM),f=pfile(i,selM);c+=p;
    rows+=`<tr><td>${i}</td><td>${esc(apt(i))}</td>
      <td>${A?`<input type="number" min="0" id="pa-${i}" value="${p||""}" placeholder="0">`:num(p)}</td>
      <td>${A?`<input type="date" id="pd-${i}" value="${dt}">`:fd(dt)}</td><td>${badge(p,d)}</td>
      <td>${f?`<button class="btn gh" onclick="showF('${f}')">🧾</button> `:""}${A?attBtn("pf-"+i)+` <button class="btn" onclick="savePay(${i})">حفظ</button>`:""}</td></tr>`;
  }
  return `<div class="chips">${MONTHS.map(m=>`<button class="chip ${m===selM?"on":""}" onclick="selM='${m}';render()">${m}</button>`).join("")}</div>
  <div class="card"><div class="top"><h3>تحصيل ${selM} ${Y}</h3><span>المحصّل: <b class="pos">${num(c)} ج</b> من ${num(d*N)} ج</span></div>

async function savePay(i){

/* --- المصروفات (مع الفواتير) --- */

    ||`<tr><td colspan="5" class="mu" style="text-align:center;padding:16px">لا توجد مصروفات</td></tr>`;

async function addExp(){
  const desc=$("#xd").value.trim(),amount=Number($("#xa").value),f=$("#xf").files[0];

  upd({[`years/${Y}/expenses/e${Date.now().toString(36)}`]:e},`مصروف: ${desc} - ${num(amount)} ج ✓`);
}
function delExp(id){
  const e=G.years?.[Y]?.expenses?.[id]||{};
  if(confirm("تأكيد حذف المصروف؟")){const o={[`years/${Y}/expenses/${id}`]:null};if(e.file)o[`files/${e.file}`]=null;upd(o,`حذف مصروف: ${e.desc||""}`)}
}

/* --- المشاريع والتحصيلات الخاصة (الكاميرات وغيرها) --- */
let selP=null;
function vCam(){
  const A=isA(),L=prj();
  if(!L.some(x=>x.id===selP))selP=(L.find(x=>!x.closed)||L[0])?.id;
  const p=L.find(x=>x.id===selP),s=share(p),ed=A&&p&&!p.closed;let col=0,rows="";
  if(p)for(let i=1;i<=N;i++){
    const v=pp(p,i),dt=p.dates?.[i]||"",f=p.files?.[i];col+=v;
    rows+=`<tr><td>${i}</td><td>${esc(apt(i))}</td>
      <td>${ed?`<input type="number" min="0" id="ca-${i}" value="${v||""}" placeholder="0">`:num(v)+" ج"}</td>
      <td>${ed?`<input type="date" id="cd-${i}" value="${dt}">`:fd(dt)}</td>
      <td class="${v>=s?"":"neg"}">${num(Math.max(0,s-v))} ج</td>
      <td>${f?`<button class="btn gh" onclick="showF('${f}')">🧾</button> `:""}${ed?attBtn("cf-"+i)+` <button class="btn" onclick="savePrj(${i})">حفظ</button>`:""}</td></tr>`;
  }
  const add=A?`<div class="card"><h3>➕ مشروع / تحصيل خاص جديد</h3><div class="row"><input id="pn" placeholder="اسم المشروع (مثال: دهان السلم)" style="flex:1;min-width:180px"><input id="ps" type="number" min="0" placeholder="نصيب الشقة" style="width:120px"><button class="btn am" onclick="addPrj()">إنشاء</button></div></div>`:"";
  const chips=L.length?`<div class="chips">${L.map(x=>`<button class="chip ${x.id===selP?"on":""}" onclick="selP='${x.id}';render()">${x.closed?"📦 ":""}${esc(x.name)}</button>`).join("")}</div>`:`<div class="card mu">لا توجد مشاريع حاليًا</div>`;
  const body=p?`<div class="g"><div class="card"><span class="mu">نصيب كل شقة</span><b style="color:var(--am)">${num(s)} ج</b></div>
    <div class="card"><span class="mu">إجمالي المطلوب</span><b>${num(s*N)} ج</b></div>
    <div class="card"><span class="mu">المحصّل</span><b class="pos">${num(col)} ج</b></div>
    <div class="card"><span class="mu">المتبقي</span><b class="neg">${num(Math.max(0,s*N-col))} ج</b></div></div>
    <div class="card"><div class="top"><h3>📷 ${esc(p.name)} ${p.closed?"(مغلق)":""}</h3>${A?`<button class="btn gh" style="color:var(--tx)" onclick="togPrj()">${p.closed?"إعادة فتح":"إغلاق وأرشفة"}</button>`:""}</div>
    <div class="tw"><table><tr><th>شقة</th><th>المالك</th><th>المدفوع</th><th>تاريخ الدفع</th><th>المتبقي</th><th>الإيصال</th></tr>${rows}</table></div></div>`:"";
  return chips+body+add;
}
async function savePrj(i){
  const v=Math.max(0,Number($("#ca-"+i).value)||0),dt=$("#cd-"+i).value||today(),f=$("#cf-"+i).files[0],b=`projects/${selP}/`;
  let fid=null;if(f){toast("جارٍ رفع الصورة…");try{fid=await attach(f)}catch(e){return toast("تعذر رفع الصورة",1)}}
  const nm=G.projects[selP].name,o=v?{[b+`payments/${i}`]:v,[b+`dates/${i}`]:dt}:{[b+`payments/${i}`]:null,[b+`dates/${i}`]:null,[b+`files/${i}`]:null};
  if(fid&&v)o[b+`files/${i}`]=fid;
  upd(o,`${nm}: شقة ${i} - ${num(v)} ج ✓`);
}
function addPrj(){
  const name=$("#pn").value.trim(),perApt=Number($("#ps").value);
  if(!name||!(perApt>0))return toast("اكتب اسم المشروع ونصيب الشقة",1);
  const id="p"+Date.now().toString(36);selP=id;upd({[`projects/${id}`]:{name,perApt}},`مشروع جديد: ${name} ✓`);
}
function togPrj(){const p=G.projects[selP];upd({[`projects/${selP}/closed`]:p.closed?null:true},`${p.closed?"إعادة فتح":"إغلاق"} مشروع ${p.name}`)}

/* --- كشف حساب الساكن --- */
function vMe(){
  const i=U.apt,d=due();let tot=0;
  const grid=MONTHS.map(m=>{const p=pay(i,m);tot+=p;
    return `<div><div class="mu">${m}</div><b class="${p?"pos":"mu"}">${num(p)} ج</b><div class="mu">${p?fd(pdate(i,m)):"—"}</div></div>`}).join("");

  <h3>الدفع الشهري (المطلوب ${num(d)} ج)</h3><div class="mg">${grid}</div></div>`;

/* --- رفع تحويل (الساكن) + اعتماد (الأدمن) --- */
function vSend(){
  return `<div class="card"><h3>📤 رفع صورة تحويل (شقة ${U.apt})</h3><div class="mu" style="margin-bottom:8px">بعد الإرسال الأدمن بيراجع الصورة ويعتمد الدفعة.</div>
  <div class="row"><select id="sm">${MONTHS.map(m=>`<option ${m===selM?"selected":""}>${m}</option>`).join("")}</select>
  <input id="sa" type="number" min="1" value="${due()}" style="width:110px"><input id="sd" type="date" value="${today()}">
  ${attBtn("sf"," صورة التحويل")}<button class="btn am" onclick="sendReq()">إرسال</button></div></div>`;
}

  if(!f||!(amount>0))return toast("اختار صورة التحويل واكتب المبلغ",1);
  try{
    toast("جارٍ الرفع…");const file=await attach(f);
    await api("pending/p"+Date.now().toString(36)+Math.random().toString(36).slice(2,4),"PUT",{email:U.email,apt:U.apt,year:Y,month:$("#sm").value,amount,date:$("#sd").value||today(),file,status:"pending",t:Date.now()});
    toast("تم إرسال الطلب للأدمن ✓");render();
  }catch(e){toast("تعذر الإرسال، حاول تاني",1)}
}
function vReq(){
  const L=Object.entries(G.pending||{}).filter(([,r])=>r).map(([id,r])=>({id,...r})).sort((a,b)=>a.t-b.t);
  const rows=L.map(r=>`<tr><td>${r.apt}</td><td>${esc(apt(r.apt))}</td><td>${esc(r.month)} ${esc(r.year||"")}</td><td>${num(r.amount)} ج</td><td>${fd(r.date)}</td>
    <td><button class="btn gh" onclick="showF('${r.file}')">🧾 عرض</button> <button class="btn" onclick="okReq('${r.id}')">اعتماد</button> <button class="btn gh" onclick="noReq('${r.id}')">رفض</button></td></tr>`).join("")
    ||`<tr><td colspan="6" class="mu" style="text-align:center;padding:16px">لا توجد طلبات بانتظار الاعتماد</td></tr>`;
  return `<div class="card"><h3>📥 طلبات تحويل بانتظار الاعتماد</h3><div class="tw"><table><tr><th>شقة</th><th>المالك</th><th>الشهر</th><th>المبلغ</th><th>التاريخ</th><th></th></tr>${rows}</table></div></div>`;
}
function okReq(id){
  const r=G.pending[id],y=r.year||Y,b=`years/${y}/`,cur=Number(G.years?.[y]?.monthlyPayments?.[r.apt]?.[r.month]||0);
  upd({[`${b}monthlyPayments/${r.apt}/${r.month}`]:cur+Number(r.amount),[`${b}payDates/${r.apt}/${r.month}`]:r.date,[`${b}payFiles/${r.apt}/${r.month}`]:r.file,[`pending/${id}`]:null},`اعتماد تحويل شقة ${r.apt} - ${r.month}: ${num(r.amount)} ج ✓`);
}
function noReq(id){const r=G.pending[id];if(confirm("رفض الطلب؟"))upd({[`pending/${id}`]:null,[`files/${r.file}`]:null},`رفض تحويل شقة ${r.apt} - ${r.month}`)}

/* --- الإدارة --- */
function vAdm(){
  const rows=Array.from({length:N},(_,k)=>k+1).map(i=>`<tr><td>${i}</td>
    <td><input id="on-${i}" value="${esc(G.apartments?.[i]?.ownerName||"")}" style="width:170px"></td>
    <td><input id="em-${i}" dir="ltr" value="${esc(emailsOf(i).join(", "))}" placeholder="gmail واحد أو أكتر" style="width:270px"></td>
    <td><button class="btn" onclick="saveApt(${i})">حفظ</button></td></tr>`).join("");
  return `<div class="card"><h3>⚙️ الإعدادات</h3><div class="row"><label>الاشتراك الشهري <input id="s-due" type="number" value="${due()}" style="width:90px"></label><button class="btn am" onclick="saveSet()">حفظ</button></div></div>
  <div class="card"><h3>👥 الملاك وإيميلات Google للدخول</h3><div class="mu" style="margin-bottom:8px">اكتب إيميل Gmail لكل شقة (أكتر من إيميل بفاصلة). الساكن ماينفعش يدخل غير لو إيميله مسجل هنا.</div><div class="tw"><table><tr><th>شقة</th><th>الاسم</th><th>إيميل الدخول</th><th></th></tr>${rows}</table></div></div>
  <div class="card"><h3>🕘 آخر التعديلات</h3><div id="logbox" class="mu">جارٍ التحميل…</div></div>
  <div class="card"><h3>🧰 صيانة البيانات</h3><button class="btn" style="margin-bottom:10px" onclick="exportCsv()">تصدير Excel (CSV) 📥</button><br><div class="mu" style="margin-bottom:8px">استعادة بيانات الشيت الأصلية (يوليو - نوفمبر 2026) تستبدل كل ما في قاعدة البيانات، استخدمها لو الداتا مش مظبوطة.</div>
  <button class="btn gh" onclick="reseed()">استعادة بيانات الشيت الأصلية</button></div>`;
}
function saveApt(i){
  const em=$("#em-"+i).value.split(/[\s,;]+/).map(x=>x.trim().toLowerCase()).filter(Boolean),old=emailsOf(i),o={},k=e=>"residents/"+e.replace(/\./g,",");
  if(em.some(e=>!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)))return toast("إيميل غير صحيح",1);
  const c=em.find(e=>{const a=G.residents[e.replace(/\./g,",")];return a&&Number(a)!==i});
  if(c)return toast(`${c} مسجل في شقة تانية`,1);
  old.forEach(e=>{if(!em.includes(e))o[k(e)]=null});em.forEach(e=>o[k(e)]=i);
  o[`apartments/${i}/ownerName`]=$("#on-"+i).value.trim();
  upd(o,`تحديث بيانات شقة ${i} ✓`);
}
function saveSet(){upd({monthlyDue:Number($("#s-due").value)||180},"تم حفظ الإعدادات ✓")}
async function reseed(){
  if(!confirm("هيتم استبدال كل بيانات قاعدة البيانات ببيانات الشيت الأصلية. متأكد؟"))return;
  try{await api("","PATCH",makeSeed());await load();initFlt();render();toast("تمت استعادة البيانات ✓")}
  catch(e){toast("تعذر الاستعادة",1)}
}

/* ---------- الصور / السجل / التصدير ---------- */
function shrink(file,max=1100,q=.7){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",q))};im.onerror=no;im.src=r.result};r.onerror=no;r.readAsDataURL(file)})}
async function attach(file){const d=await shrink(file),id="f"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);await api("files/"+id,"PUT",d);return id}
async function showF(id){
  const w=window.open("","_blank");
  try{const d=await api("files/"+id);w.document.write(`<title>إيصال</title><body style="margin:0;background:#000"><img src="${d}" style="max-width:100%;display:block;margin:auto">`)}
  catch(e){if(w)w.close();toast("تعذر تحميل الصورة",1)}
}
async function loadLog(){
  try{
    const d=await api("log","GET",undefined,"?orderBy=%22%24key%22&limitToLast=40"),el=$("#logbox");if(!el)return;
    const L=Object.values(d||{}).sort((a,b)=>b.t-a.t);
    el.innerHTML=L.length?`<table>${L.map(l=>`<tr><td>${new Date(l.t).toLocaleString("ar-EG",{dateStyle:"short",timeStyle:"short"})}</td><td>${esc(l.who)}</td><td style="white-space:normal">${esc(l.msg)}</td></tr>`).join("")}</table>`:"لا توجد تعديلات مسجلة بعد";
  }catch(e){const el=$("#logbox");if(el)el.textContent="تعذر تحميل السجل"}
}
function exportCsv(){
  const r=[["شقة","المالك",...MONTHS,"الإجمالي"]];
  for(let i=1;i<=N;i++){const v=MONTHS.map(m=>pay(i,m));r.push([i,apt(i),...v,v.reduce((a,b)=>a+b,0)])}
  r.push([],["المصروفات"],["الشهر","البيان","المبلغ","التاريخ"]);exps().forEach(e=>r.push([e.month,e.desc,e.amount,e.date||""]));
  const csv="\ufeff"+r.map(x=>x.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=`building60-${Y}.csv`;a.click();
}
